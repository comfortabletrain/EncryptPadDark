name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-libbotan
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          # 1. Locate and copy host build tools (uic, moc, rcc, etc.) to qt6-static/bin
          mkdir -p /ucrt64/qt6-static/bin
          if [ -d /ucrt64/share/qt6/bin ]; then
            cp -f /ucrt64/share/qt6/bin/*.exe /ucrt64/qt6-static/bin/ 2>/dev/null || true
          fi
          for tool in uic.exe moc.exe rcc.exe; do
            tool_path=$(find /ucrt64 -name "$tool" 2>/dev/null | head -n 1)
            if [ -n "$tool_path" ] && [ ! -f "/ucrt64/qt6-static/bin/$tool" ]; then
              echo "Found $tool at $tool_path, copying to /ucrt64/qt6-static/bin/"
              cp -f "$tool_path" /ucrt64/qt6-static/bin/
            fi
          done
          echo "=== qt6-static/bin contents ==="
          ls -la /ucrt64/qt6-static/bin/

          # 2. Configure qt.conf so qmake in qt6-static can resolve relative paths
          echo -e "[Paths]\nPrefix = ..\nArchData = share/qt6\nData = share/qt6\nPlugins = share/qt6/plugins" > /ucrt64/qt6-static/bin/qt.conf

          # 3. Ensure mkspecs and plugins are accessible in both standard and isolated paths
          if [ -d /ucrt64/qt6-static/share/qt6/mkspecs ]; then
            mkdir -p /ucrt64/qt6-static/mkspecs
            cp -rn /ucrt64/qt6-static/share/qt6/mkspecs/* /ucrt64/qt6-static/mkspecs/ || true
          fi
          if [ -d /ucrt64/qt6-static/share/qt6/plugins ]; then
            mkdir -p /ucrt64/qt6-static/plugins
            cp -rn /ucrt64/qt6-static/share/qt6/plugins/* /ucrt64/qt6-static/plugins/ || true
          fi

          export PATH="/ucrt64/qt6-static/bin:/ucrt64/share/qt6/bin:/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/qt6-static/lib/pkgconfig:$PKG_CONFIG_PATH"
          export QMAKESPEC="/ucrt64/qt6-static/share/qt6/mkspecs/win32-g++"
          python3 configure.py --os mingw --cpu x86_64 --cc gcc --link-method copy --static --qmake-bin=/ucrt64/qt6-static/bin/qmake
          make -j$(nproc)

      - name: Run Unit Tests
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/qt6-static/bin:/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/qt6-static/lib/pkgconfig:$PKG_CONFIG_PATH"
          python3 configure.py --without-qt-ui --test --os mingw --cpu x86_64 --cc gcc --link-method copy --static
          make -j$(nproc)
          cd src/test
          ../../bin/release/encryptpad_test.exe

      - name: Rebuild Release Target
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/qt6-static/bin:/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/qt6-static/lib/pkgconfig:$PKG_CONFIG_PATH"
          export QMAKESPEC="/ucrt64/qt6-static/share/qt6/mkspecs/win32-g++"
          python3 configure.py --os mingw --cpu x86_64 --cc gcc --link-method copy --static --qmake-bin=/ucrt64/qt6-static/bin/qmake
          make -j$(nproc)

      - name: Prepare Release Package
        shell: msys2 {0}
        run: |
          # Strip symbols to match upstream standalone executable sizes (~33MB)
          strip -s bin/release/encryptpad.exe bin/release/encryptcli.exe

          mkdir -p EncryptPadDark-Windows-x64
          cp bin/release/encryptpad.exe EncryptPadDark-Windows-x64/
          cp bin/release/encryptcli.exe EncryptPadDark-Windows-x64/
          cp CHANGES.htm EncryptPadDark-Windows-x64/
          cp CHANGES.md EncryptPadDark-Windows-x64/
          cp README.htm EncryptPadDark-Windows-x64/
          cp README.md EncryptPadDark-Windows-x64/
          cp README.png EncryptPadDark-Windows-x64/
          cp credits.txt EncryptPadDark-Windows-x64/
          cp -r docs EncryptPadDark-Windows-x64/
          cp license.txt EncryptPadDark-Windows-x64/
          cp license_3rd_party.txt EncryptPadDark-Windows-x64/

          # Verify that executables are completely standalone without MSYS2/Qt DLL dependencies
          echo "=== DLL Dependencies of encryptpad.exe ==="
          ldd EncryptPadDark-Windows-x64/encryptpad.exe
          echo "=== DLL Dependencies of encryptcli.exe ==="
          ldd EncryptPadDark-Windows-x64/encryptcli.exe

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path EncryptPadDark-Windows-x64 -DestinationPath EncryptPadDark-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EncryptPadDark-Windows-x64
          path: EncryptPadDark-Windows-x64.zip
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EncryptPadDark-Windows-x64.zip
          generate_release_notes: true
